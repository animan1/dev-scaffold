services:
  nginx:
    environment:
      PROD_HTTPS_PORT: "${PROD_HTTPS_PORT:-18443}"
    volumes:
      - "${INGRESS_CERTS_PATH:?Run make prepare-ephemeral}:/etc/nginx/certs:ro"
    ports: !override
      - "127.0.0.1:${HOST_INGRESS_PORT:-18080}:80"
      - "127.0.0.1:${PROD_HTTPS_PORT:-18443}:443"
