# This listener is trusted to consume forwarding headers only because Compose
# publishes it on a loopback address. The separately owned host ingress must
# replace, rather than append to, client-supplied forwarding headers.
map $http_x_forwarded_proto $trusted_forwarded_proto {
  default $scheme;
  http http;
  https https;
}

map $http_x_forwarded_for $trusted_forwarded_for {
  default $http_x_forwarded_for;
  "" $remote_addr;
}

server {
  listen 80;
  listen [::]:80;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';" always;

  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $trusted_forwarded_for;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_read_timeout 60s;
  }

  location /static/ {
    alias /static/;
    add_header Cache-Control "public, max-age=3600";
  }

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
