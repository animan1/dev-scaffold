services:
  db:
    image: postgres:16
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      target: prod
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    environment:
      DEPLOYMENT_ENVIRONMENT: production
      RELEASE_REVISION: "${RELEASE_REVISION:-unknown}"
      RELEASE_IMAGE_PREFIX: "${RELEASE_IMAGE_PREFIX:-unconfigured}"
      RELEASE_DEPLOYED_AT: "${RELEASE_DEPLOYED_AT:-}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/static
      - backup_status:/backup-status:ro

  monitor:
    profiles: ["monitoring"]
    build:
      context: ../backend
      target: prod
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    environment:
      BACKUP_STATUS_DIR: /backup-status
      DEPLOYMENT_ENVIRONMENT: production
      RELEASE_REVISION: "${RELEASE_REVISION:-unknown}"
      RELEASE_IMAGE_PREFIX: "${RELEASE_IMAGE_PREFIX:-unconfigured}"
      RELEASE_DEPLOYED_AT: "${RELEASE_DEPLOYED_AT:-}"
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "python",
        "-m",
        "app.manage",
        "monitor_operational_integrity",
        "--watch",
        "--interval-seconds",
        "${MONITOR_INTERVAL_SECONDS:-900}",
      ]
    restart: unless-stopped
    volumes:
      - backup_status:/backup-status:ro

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/static:ro
    depends_on:
      - backend

volumes:
  pgdata:
  staticfiles:
  backup_status:
