name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  immutable-release:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      RELEASE_PLATFORM: linux/amd64
      DIFF_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
      RELEASE_BACKEND_SBOM: .local/sbom/backend.spdx.json
      RELEASE_WEB_SBOM: .local/sbom/web.spdx.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare the required containerd image store
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - name: Read selected profiles and release namespace
        id: profiles
        shell: bash
        run: |
          metadata="$(make --no-print-directory profiles)"
          echo "selected=$(jq -r '.selected.application' <<< "$metadata")" >> "$GITHUB_OUTPUT"
          echo "applications=$(jq -r '.validation.application | join(" ")' <<< "$metadata")" >> "$GITHUB_OUTPUT"
          echo "backups=$(jq -r 'if (.validation.backup | length) == 0 then "none" else (.validation.backup | join(" ")) end' <<< "$metadata")" >> "$GITHUB_OUTPUT"
          echo "backup=$(jq -r '.selected.backup' <<< "$metadata")" >> "$GITHUB_OUTPUT"
          echo "RELEASE_IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Run the same source and ephemeral acceptance commands locally and in CI
        env:
          APPLICATIONS: ${{ steps.profiles.outputs.applications }}
          BACKUPS: ${{ steps.profiles.outputs.backups }}
        run: |
          for profile in $APPLICATIONS; do
            for backup in $BACKUPS; do
              make SCAFFOLD_PROFILE="$profile" SCAFFOLD_BACKUP_PROFILE="$backup" ci-ephemeral
            done
          done

      # All configured profiles must pass before publication. Keeping their
      # images on one runner lets publish reuse exact tested IDs without rebuilds.
      - name: Select the tested primary image set
        id: images
        env:
          PROFILE: ${{ steps.profiles.outputs.selected }}
        run: |
          manifest=".local/releases/${GITHUB_SHA}/${PROFILE}/amd64/manifest.json"
          echo "backend=$(jq -r '.images.backend' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "web=$(jq -r '.images.web' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "RELEASE_MANIFEST=${manifest}" >> "$GITHUB_ENV"

      - name: Generate backend SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.images.outputs.backend }}
          format: spdx-json
          output-file: ${{ env.RELEASE_BACKEND_SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Generate web SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.images.outputs.web }}
          format: spdx-json
          output-file: ${{ env.RELEASE_WEB_SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Detect artifact attestation support
        id: provenance
        run: |
          supported="$(scripts/release-attestation-support \
            --visibility '${{ github.event.repository.visibility }}' \
            --owner-type '${{ github.event.repository.owner.type }}' \
            --nonpublic-opt-in '${{ vars.ENABLE_NONPUBLIC_ATTESTATIONS }}')"
          echo "supported=${supported}" >> "$GITHUB_OUTPUT"

      - name: Log in to this repository's GHCR packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the exact tested release through the operator command
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAFFOLD_PROFILE: ${{ steps.profiles.outputs.selected }}
          SCAFFOLD_BACKUP_PROFILE: ${{ steps.profiles.outputs.backup }}
        run: |
          make publish
          backend="$(jq -r '.images.backend' "$RELEASE_MANIFEST")"
          web="$(jq -r '.images.web' "$RELEASE_MANIFEST")"
          echo "backend_name=${backend%@*}" >> "$GITHUB_OUTPUT"
          echo "backend_digest=${backend#*@}" >> "$GITHUB_OUTPUT"
          echo "web_name=${web%@*}" >> "$GITHUB_OUTPUT"
          echo "web_digest=${web#*@}" >> "$GITHUB_OUTPUT"

      - name: Report reduced provenance fallback
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.provenance.outputs.supported != 'true'
        run: echo '::warning title=Artifact attestations unavailable::The recorded release and SPDX SBOMs were published without GitHub artifact attestations.'

      - name: Attest backend SBOM
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.provenance.outputs.supported == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.release.outputs.backend_name }}
          subject-digest: ${{ steps.release.outputs.backend_digest }}
          sbom-path: ${{ env.RELEASE_BACKEND_SBOM }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest web SBOM
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.provenance.outputs.supported == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.release.outputs.web_name }}
          subject-digest: ${{ steps.release.outputs.web_digest }}
          sbom-path: ${{ env.RELEASE_WEB_SBOM }}
          push-to-registry: true
          create-storage-record: false
