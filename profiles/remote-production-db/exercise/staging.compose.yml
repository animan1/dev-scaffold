services:
  production-db-tunnel:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  staging-probe:
    image: postgres:16.10-bookworm
    environment:
      PGCONNECT_TIMEOUT: 2
      PGDATABASE: scaffold_remote
      PGHOST: production-db-tunnel
      PGPASSWORD: exercise-only
      PGUSER: scaffold_remote
    depends_on:
      production-db-tunnel:
        condition: service_healthy
    entrypoint: ["psql"]
