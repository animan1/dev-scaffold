services:
  db:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: scaffold_remote
      POSTGRES_PASSWORD: exercise-only
      POSTGRES_USER: scaffold_remote
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scaffold_remote -d scaffold_remote"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - remote_db:/var/lib/postgresql/data
      - ./profiles/remote-production-db/exercise/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  sshd:
    build:
      context: .
      dockerfile: profiles/remote-production-db/exercise/sshd.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${REMOTE_DB_EXERCISE_SSH_PORT:-22222}:22"
    volumes:
      - ${REMOTE_DB_EXERCISE_ROOT:?Set REMOTE_DB_EXERCISE_ROOT}/authorized_keys:/run/secrets/authorized_keys:ro
      - ${REMOTE_DB_EXERCISE_ROOT:?Set REMOTE_DB_EXERCISE_ROOT}/host:/etc/ssh/ssh_host_ed25519_key:ro

volumes:
  remote_db:
