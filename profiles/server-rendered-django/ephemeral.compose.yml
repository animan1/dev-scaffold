services:
  ephemeral-ingress:
    image: "${EPHEMERAL_INGRESS_IMAGE:?Set EPHEMERAL_INGRESS_IMAGE through the profile Makefile}"
    depends_on:
      web:
        condition: service_started
    environment:
      INGRESS_HTTPS_PORT: "${EPHEMERAL_HTTPS_PORT:-18444}"
    ports:
      - "127.0.0.1:${EPHEMERAL_HTTP_PORT:-18081}:80"
      - "127.0.0.1:${EPHEMERAL_HTTPS_PORT:-18444}:443"
    restart: unless-stopped
