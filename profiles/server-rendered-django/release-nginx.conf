worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/nginx/client-body;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  proxy_temp_path /tmp/nginx/proxy;
  scgi_temp_path /tmp/nginx/scgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  sendfile on;

  map $http_x_forwarded_proto $trusted_forwarded_proto {
    default $scheme;
    http http;
    https https;
  }

  map $http_x_forwarded_for $trusted_forwarded_for {
    default $http_x_forwarded_for;
    "" $remote_addr;
  }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
      alias /static/;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=3600";
    }

    location /media/ {
      alias /media/;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=300";
      add_header X-Content-Type-Options nosniff always;
    }

    location / {
      proxy_pass http://app:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $trusted_forwarded_for;
      proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
      proxy_read_timeout 60s;
    }
  }
}
