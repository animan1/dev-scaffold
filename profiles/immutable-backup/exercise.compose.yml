services:
  db:
    image: "${BACKUP_POSTGRES_IMAGE:?Set BACKUP_POSTGRES_IMAGE through the profile Makefile}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - exercise_postgres:/var/lib/postgresql/data

  backup:
    depends_on:
      db:
        condition: service_healthy

volumes:
  exercise_postgres:
